<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Para ti, Tati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cielo-profundo:#061A16;
    --bosque:#123D2F;
    --bosque-claro:#2D6A4F;
    --bosque-silueta:#081F18;
    --verde-suave:#72D6A2;
    --celeste:#45C7F2;
    --celeste-palido:#D9F8FF;
    --crema:#F4FFF9;
    --rojo:#D94A62;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 15% 18%, rgba(69,199,242,.14), transparent 27%),
      radial-gradient(circle at 85% 72%, rgba(114,214,162,.13), transparent 30%),
      linear-gradient(145deg, var(--cielo-profundo) 0%, #09271F 42%, var(--bosque) 100%);
    color:var(--crema);
    font-family:'Work Sans', sans-serif;
    overflow-x:hidden;
  }
  body{ min-height:100vh; position:relative; }

  /* ---------- Luciérnagas ---------- */
  #fireflies{ position:fixed; inset:0; z-index:1; pointer-events:none; }

  /* ---------- Bosque ---------- */
  .forest{ position:fixed; left:0; right:0; bottom:0; display:flex; align-items:flex-end; pointer-events:none; overflow:hidden; }
  .forest.back{ height:18vh; z-index:2; opacity:.48; }
  .forest.front{ height:23vh; z-index:2; opacity:.9; }
  .tree{ flex:1; margin:0 -1px; clip-path:polygon(50% 0%, 8% 100%, 92% 100%); transform-origin:bottom center; }
  .forest.back .tree{ background:var(--bosque-claro); animation:sway 7s ease-in-out infinite; }
  .forest.front .tree{ background:var(--bosque-silueta); animation:sway 9s ease-in-out infinite; }
  .tree:nth-child(odd){ animation-delay:-2.5s; }
  .tree:nth-child(3n){ animation-delay:-4.5s; }
  @keyframes sway{ 0%,100%{ transform:rotate(-0.6deg); } 50%{ transform:rotate(0.6deg); } }

  /* ---------- Fondo animado ---------- */
  .aurora{
    position:fixed; width:45vw; height:45vw; border-radius:50%;
    pointer-events:none; z-index:0; filter:blur(70px); opacity:.16;
    mix-blend-mode:screen;
  }
  .aurora-one{ top:-18vw; left:-10vw; background:var(--celeste); animation:auroraMove 13s ease-in-out infinite; }
  .aurora-two{ right:-14vw; bottom:-12vw; background:var(--verde-suave); animation:auroraMove 16s ease-in-out infinite reverse; }
  .sparkle-field{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
    background-image:radial-gradient(circle, rgba(217,248,255,.7) 1px, transparent 1.5px);
    background-size:85px 85px;
    animation:sparkleMove 18s linear infinite;
  }
  @keyframes auroraMove{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(8vw,5vh) scale(1.18); }
  }
  @keyframes sparkleMove{
    from{ transform:translate(0,0); }
    to{ transform:translate(42px,42px); }
  }

  /* ---------- Intro ---------- */
  #intro-screen{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px;
    background:radial-gradient(circle at 50% 40%, rgba(76,201,240,0.08), transparent 60%);
    transition:opacity 1s ease, visibility 1s;
  }
  #intro-screen.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .intro-title{
    font-family:'Fraunces', serif; font-weight:500; font-style:italic;
    font-size:clamp(1.9rem, 6vw, 2.8rem); color:var(--celeste-palido);
    margin:0 0 14px; letter-spacing:0.01em;
  }
  .intro-sub{ font-size:0.98rem; color:rgba(241,250,238,0.75); max-width:300px; margin:0 0 34px; line-height:1.6; }
  #start-btn{
    font-family:'Work Sans', sans-serif; font-size:0.95rem; font-weight:500;
    color:var(--cielo-profundo); background:var(--celeste); border:none;
    padding:14px 30px; border-radius:999px; cursor:pointer;
    animation:pulse-btn 2.4s ease-in-out infinite; transition:transform .25s ease;
  }
  #start-btn:hover{ transform:translateY(-2px); }
  #start-btn:focus-visible{ outline:2px solid var(--celeste-palido); outline-offset:3px; }
  @keyframes pulse-btn{
    0%{ box-shadow:0 0 0 0 rgba(76,201,240,0.45); }
    70%{ box-shadow:0 0 0 16px rgba(76,201,240,0); }
    100%{ box-shadow:0 0 0 0 rgba(76,201,240,0); }
  }

  /* ---------- Control de audio flotante ---------- */
  #audio-toggle{
    position:fixed; top:18px; right:18px; z-index:15;
    width:42px; height:42px; border-radius:50%;
    border:1px solid rgba(241,250,238,0.3);
    background:rgba(8,28,21,0.45); color:var(--crema);
    font-size:0.95rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; transition:opacity .6s ease, visibility .6s, border-color .3s ease;
  }
  #audio-toggle.show{ opacity:1; visibility:visible; }
  #audio-toggle:hover{ border-color:var(--celeste); }
  #audio-toggle:focus-visible{ outline:2px solid var(--celeste-palido); outline-offset:3px; }

  /* ---------- Diapositivas ---------- */
  #deck{
    position:relative; z-index:4; min-height:100vh;
    display:flex; flex-direction:column; justify-content:center;
    padding:clamp(58px,7vh,82px) clamp(18px,5vw,70px) 34px;
    opacity:0; transition:opacity 1.2s ease .2s;
  }
  #deck.show{ opacity:1; }

  .slides-wrap{
    position:relative; flex:1; min-height:58vh;
    width:min(100%, 1100px); margin:0 auto;
  }

  .slide{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center; opacity:0; transform:translateY(22px) scale(.985);
    transition:opacity .9s ease, transform 1s cubic-bezier(.2,.75,.25,1);
    pointer-events:none; padding:8px;
  }
  .slide::before{
    content:""; position:absolute; width:min(75vw,650px); height:min(75vw,650px);
    border-radius:50%;
    background:radial-gradient(circle, rgba(69,199,242,.08), transparent 68%);
    filter:blur(4px); z-index:-1; animation:ambientGlow 6s ease-in-out infinite;
  }
  .slide.active{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }

  .slide-text{
    position:relative;
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    font-size:clamp(1.04rem, 2.25vw, 1.62rem);
    line-height:1.62; color:var(--crema);
    width:min(94vw, 900px); max-height:74vh; overflow:auto;
    margin:0; padding:clamp(18px,3vw,34px);
    text-shadow:0 2px 22px rgba(0,0,0,.28);
    scrollbar-width:thin;
    animation:textFloat 6s ease-in-out infinite;
  }
  .slide-text::after{
    content:""; position:absolute; left:50%; bottom:0;
    width:70px; height:2px; transform:translateX(-50%);
    background:linear-gradient(90deg, transparent, var(--celeste), transparent);
    opacity:.75;
  }

  /* ---------- Diapositiva final: foto en corazón ---------- */
  .slide-photo{ flex-direction:column; gap:4px; }
  .slide-photo::before{ width:min(92vw,720px); height:min(92vw,720px); }
  .slide-photo-frame{
    position:relative; width:min(88vw, 540px); aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
  }
  .slide-photo-frame::before{
    content:""; position:absolute; inset:7%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(69,199,242,.23), rgba(114,214,162,.09) 45%, transparent 72%);
    filter:blur(22px); animation:photoAura 4.5s ease-in-out infinite;
  }
  .slide-photo-frame svg{
    position:relative; z-index:1;
    width:100%; height:100%; display:block; overflow:visible;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.58));
    animation:heartbeat 4s ease-in-out infinite;
  }
  .slide-photo-frame svg image{ transition:transform .8s ease; }

  @keyframes heartbeat{
    0%,100%{ transform:scale(1); }
    7%{ transform:scale(1.025); }
    14%{ transform:scale(1); }
    21%{ transform:scale(1.018); }
    28%{ transform:scale(1); }
  }
  @keyframes ambientGlow{
    0%,100%{ transform:scale(.94); opacity:.65; }
    50%{ transform:scale(1.06); opacity:1; }
  }
  @keyframes textFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-3px); }
  }
  @keyframes photoAura{
    0%,100%{ transform:scale(.9); opacity:.55; }
    50%{ transform:scale(1.08); opacity:1; }
  }

  .hearts-float{ position:absolute; inset:-8% -12%; pointer-events:none; overflow:visible; z-index:2; }
  .heart-particle{
    position:absolute; bottom:12%; width:12px; height:12px;
    background:var(--celeste); opacity:0; transform:rotate(45deg) scale(.7);
    animation-name:floatHeart; animation-timing-function:ease-in; animation-fill-mode:forwards;
    filter:drop-shadow(0 0 7px rgba(69,199,242,.55));
  }
  .heart-particle::before,.heart-particle::after{
    content:""; position:absolute; width:12px; height:12px;
    border-radius:50%; background:inherit;
  }
  .heart-particle::before{ left:-6px; top:0; }
  .heart-particle::after{ left:0; top:-6px; }

  @keyframes floatHeart{
    0%{ opacity:0; transform:translateY(0) translateX(0) rotate(45deg) scale(.55); }
    12%{ opacity:.9; }
    88%{ opacity:.7; }
    100%{ opacity:0; transform:translateY(-260px) translateX(var(--drift,0px)) rotate(var(--rot,45deg)) scale(1); }
  }

  .restart-link{
    margin-top:4px; background:none; border:none; color:rgba(241,250,238,0.65);
    font-size:0.82rem; text-decoration:underline; cursor:pointer; font-family:'Work Sans', sans-serif;
  }
  .restart-link:focus-visible{ outline:2px solid var(--celeste-palido); outline-offset:3px; }

  /* ---------- Navegación ---------- */
  .deck-nav{ display:flex; align-items:center; justify-content:center; gap:22px; padding-top:24px; }
  .deck-nav button.nav-arrow{
    width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(241,250,238,0.3); background:transparent; color:var(--crema);
    font-size:1.3rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:opacity .3s ease, border-color .3s ease, transform .25s ease;
  }
  .deck-nav button.nav-arrow:hover:not(:disabled){ border-color:var(--celeste); transform:scale(1.06); }
  .deck-nav button.nav-arrow:disabled{ opacity:0.2; cursor:default; }
  .deck-nav button.nav-arrow:focus-visible{ outline:2px solid var(--celeste-palido); outline-offset:3px; }
  .dots{ display:flex; gap:8px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:rgba(241,250,238,0.3); transition:background .3s ease, transform .3s ease; }
  .dot.active{ background:var(--celeste); transform:scale(1.35); }

  @media (max-width:700px){
    #deck{ padding-left:10px; padding-right:10px; }
    .slides-wrap{ min-height:66vh; }
    .slide-text{
      width:96vw; max-height:70vh;
      font-size:clamp(.98rem, 4.15vw, 1.18rem);
      line-height:1.56; padding:12px 14px 20px;
    }
    .slide-photo-frame{ width:min(94vw, 430px); }
    .deck-nav{ padding-top:10px; gap:16px; }
  }

  @media (min-width:1000px){
    .slide-text{ font-size:clamp(1.28rem, 1.8vw, 1.72rem); }
    .slide-photo-frame{ width:min(62vw, 560px); }
  }

  @media (prefers-reduced-motion:reduce){
    .tree{ animation:none !important; }
    #start-btn{ animation:none !important; }
    .slide-photo-frame svg{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="aurora aurora-one"></div>
<div class="aurora aurora-two"></div>
<div class="sparkle-field" aria-hidden="true"></div>
<canvas id="fireflies"></canvas>
<div class="forest back" id="forest-back"></div>
<div class="forest front" id="forest-front"></div>

<div id="intro-screen">
  <p class="intro-title">Para ti, Tati</p>
  <p class="intro-sub"></p>
  <button id="start-btn" type="button">Comenzar</button>
</div>

<button id="audio-toggle" type="button" aria-label="Pausar canción">❚❚</button>

<main id="deck">
  <div class="slides-wrap" id="slides-wrap">
    <!-- Las diapositivas de texto se generan aquí automáticamente -->
    <div class="slide slide-photo" id="slide-photo">
      <div class="slide-photo-frame">
        <div class="hearts-float" id="hearts-float"></div>
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-label="Foto enmarcada en un corazón">
          <defs>
            <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
              <path d="M0.5,0.15 C0.35,-0.05 0,0.05 0,0.32 C0,0.55 0.25,0.70 0.5,0.90 C0.75,0.70 1,0.55 1,0.32 C1,0.05 0.65,-0.05 0.5,0.15 Z"/>
            </clipPath>
          </defs>
          <image href="tati-foto(1).jpg" xlink:href="tati-foto(1).jpg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#heartClip)"></image>
          <path d="M50,15 C35,-5 0,5 0,32 C0,55 25,70 50,90 C75,70 100,55 100,32 C100,5 65,-5 50,15 Z" fill="none" stroke="#E63946" stroke-width="2.6" stroke-linejoin="round"/>
        </svg>
      </div>
      <button class="restart-link" id="restart-btn" type="button">Volver a empezar</button>
    </div>
  </div>

  <nav class="deck-nav">
    <button class="nav-arrow" id="prev-btn" type="button" aria-label="Diapositiva anterior">‹</button>
    <div class="dots" id="dots"></div>
    <button class="nav-arrow" id="next-btn" type="button" aria-label="Siguiente diapositiva">›</button>
  </nav>
</main>

<audio id="audio" src="tati-cancion.mp3" preload="auto" loop></audio>

<script>
(function(){
  "use strict";

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* =========================================================
     EDITA TUS FRASES AQUÍ
     Cada línea del arreglo es una diapositiva de texto.
     Agrega, quita o cambia las frases que quieras: la foto
     final se agrega sola después de la última.
     ========================================================= */
  var SLIDES = [
    "Promesa de sal y limón",
    "Hola, mi Tati hermosa. Después de mucho tiempo, por fin puedo hacerte los detalles que durante tanto tiempo esperé hacerte. Mi motivación volvió gracias a ti, eres mi motivo de mejora. Agradezco todos los momentos que pasamos y las situaciones que vivimos, y que con el tiempo pudimos hablar y solucionar. Los recuerdos me llenan la vida de felicidad.",
    "Siempre esperé este momento porque sabía que tú eras el amor de mi vida. Desde ese día en el parque supe que no iba a ser feliz sin ti. Luego, el día de Santo Domingo, supe que eso no se había ido. Verte a los ojos y poder apreciar cada centímetro de tu piel, poder ver tus lunares, tu sonrisa, tus dientes, tu pelo, tu olor y tus abrazos. Los besitos que, a pesar de decir que estaba tu mamá detrás, muy poco te negaste a darme. Darnos las manos, vernos... fue increíble. No tengo forma de explicar ni de describir lo que sentí en ese momento; fue súper impresionante.",
    "A pesar de las condiciones de tu padre, no me importa. Yo te amo y lucharé por mi Tati, la que tanto amo, hasta el día que me digas que ya no lo haga. De lo contrario, tienes a tu loco obsesionado contigo.",
    "Recordá que tenemos una promesa de sal y limón y que, hasta que se cumpla, no voy a ser feliz. Yo sé que tú sos la indicada: linda, inteligente, creativa, loquita y, en resumen, perfecta. El amor de mi vida, y no me voy a cansar de decirlo. Siempre te voy a tener en mi mente porque tú sos la ideal. Espero que pasemos una vida juntos y, si no, ya sabes, los amarres están a la orden del día. Te amooooooo, mi cachetona hermosa, bella y peshoshaaaaaa."
  ];

  /* ---------- Bosque ---------- */
  function buildForest(container, count, minH, maxH){
    if(!container) return;
    container.innerHTML = '';
    for(var i = 0; i < count; i++){
      var t = document.createElement('div');
      t.className = 'tree';
      var h = minH + Math.random() * (maxH - minH);
      t.style.height = h + '%';
      container.appendChild(t);
    }
  }
  buildForest(document.getElementById('forest-back'), 16, 45, 88);
  buildForest(document.getElementById('forest-front'), 10, 55, 100);

  /* ---------- Luciérnagas ---------- */
  var canvas = document.getElementById('fireflies');
  var ctx = canvas.getContext('2d');
  var particles = [];

  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  var particleColors = ['#4CC9F0', '#CAF0F8', '#8FE3B5'];
  var fireflyCount = window.innerWidth < 600 ? 26 : 46;
  for(var i = 0; i < fireflyCount; i++){
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.6 + 0.8,
      speed: (Math.random() * 0.25 + 0.06) * (reduceMotion ? 0.3 : 1),
      drift: (Math.random() * 0.4 - 0.2) * (reduceMotion ? 0.3 : 1),
      color: particleColors[Math.floor(Math.random() * particleColors.length)],
      phase: Math.random() * Math.PI * 2,
      flicker: Math.random() * 0.02 + 0.01
    });
  }

  function drawFireflies(){
    requestAnimationFrame(drawFireflies);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for(var i = 0; i < particles.length; i++){
      var p = particles[i];
      p.phase += p.flicker;
      var alpha = 0.35 + Math.sin(p.phase) * 0.3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0.1, alpha);
      ctx.fill();
      p.y -= p.speed;
      p.x += p.drift;
      if(p.y < -10){ p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
      if(p.x < -10) p.x = canvas.width + 10;
      if(p.x > canvas.width + 10) p.x = -10;
    }
    ctx.globalAlpha = 1;
  }
  drawFireflies();

  /* ---------- Construir diapositivas de texto ---------- */
  var slidesWrap = document.getElementById('slides-wrap');
  var photoSlide = document.getElementById('slide-photo');

  SLIDES.forEach(function(text){
    var div = document.createElement('div');
    div.className = 'slide';
    var p = document.createElement('p');
    p.className = 'slide-text';
    p.textContent = text;
    div.appendChild(p);
    slidesWrap.insertBefore(div, photoSlide);
  });

  var slides = Array.prototype.slice.call(slidesWrap.querySelectorAll('.slide'));
  var lastIndex = slides.length - 1;
  var currentIndex = 0;
  var started = false;
  var syncEnabled = false;
  var slideWeights = SLIDES.map(function(text){ return Math.max(1, text.length); }).concat([80]);
  var weightTotal = slideWeights.reduce(function(a,b){ return a+b; }, 0);

  /* ---------- Puntos indicadores ---------- */
  var dotsWrap = document.getElementById('dots');
  slides.forEach(function(){
    var d = document.createElement('span');
    d.className = 'dot';
    dotsWrap.appendChild(d);
  });
  var dots = Array.prototype.slice.call(dotsWrap.querySelectorAll('.dot'));

  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');

  /* ---------- Corazones flotantes (última diapositiva) ---------- */
  var heartSpawnInterval = null;
  function startHearts(){
    if(heartSpawnInterval || reduceMotion) return;
    var container = document.getElementById('hearts-float');
    if(!container) return;
    heartSpawnInterval = setInterval(function(){
      if(container.children.length > 14) return;
      var span = document.createElement('span');
      span.className = 'heart-particle';
      var size = 14 + Math.random() * 14;
      var duration = 4 + Math.random() * 3;
      var drift = (Math.random() * 60 - 30) + 'px';
      var rot = (Math.random() * 40 - 20) + 'deg';
      span.style.left = (Math.random() * 100) + '%';
      span.style.fontSize = size + 'px';
      span.style.animationDuration = duration + 's';
      span.style.setProperty('--drift', drift);
      span.style.setProperty('--rot', rot);
      container.appendChild(span);
      setTimeout(function(){
        if(span.parentNode) span.parentNode.removeChild(span);
      }, duration * 1000 + 150);
    }, 550);
  }
  function stopHearts(){
    if(heartSpawnInterval){ clearInterval(heartSpawnInterval); heartSpawnInterval = null; }
    var container = document.getElementById('hearts-float');
    if(container) container.innerHTML = '';
  }

  /* ---------- Render ---------- */
  function renderSlide(){
    slides.forEach(function(s, i){
      s.classList.toggle('active', i === currentIndex);
    });
    dots.forEach(function(d, i){
      d.classList.toggle('active', i === currentIndex);
    });
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === lastIndex;

    if(currentIndex === lastIndex){
      startHearts();
    }else{
      stopHearts();
    }
  }

  function slideFromSongTime(){
    if(!syncEnabled || !audio.duration || !isFinite(audio.duration)) return;
    var progress = Math.max(0, Math.min(0.999999, audio.currentTime / audio.duration));
    var target = progress * weightTotal;
    var accumulated = 0;
    for(var i = 0; i < slideWeights.length; i++){
      accumulated += slideWeights[i];
      if(target < accumulated){
        if(currentIndex !== i){
          currentIndex = i;
          renderSlide();
        }
        return;
      }
    }
  }

  function syncAudioToSlide(index){
    if(!audio.duration || !isFinite(audio.duration)) return;
    var startWeight = 0;
    for(var i = 0; i < index; i++){
      startWeight += slideWeights[i];
    }
    audio.currentTime = (startWeight / weightTotal) * audio.duration;
  }

  function goNext(){
    if(!started || currentIndex >= lastIndex) return;
    currentIndex++;
    syncAudioToSlide(currentIndex);
    renderSlide();
  }
  function goPrev(){
    if(!started || currentIndex <= 0) return;
    currentIndex--;
    syncAudioToSlide(currentIndex);
    renderSlide();
  }

  nextBtn.addEventListener('click', goNext);
  prevBtn.addEventListener('click', goPrev);

  document.getElementById('restart-btn').addEventListener('click', function(){
    currentIndex = 0;
    if(audio.duration && isFinite(audio.duration)){
      audio.currentTime = 0;
    }
    renderSlide();
    syncEnabled = true;
  });

  document.addEventListener('keydown', function(e){
    if(!started) return;
    if(e.key === 'ArrowRight') goNext();
    if(e.key === 'ArrowLeft') goPrev();
  });

  var touchStartX = null;
  slidesWrap.addEventListener('touchstart', function(e){
    touchStartX = e.changedTouches[0].clientX;
  }, { passive:true });
  slidesWrap.addEventListener('touchend', function(e){
    if(touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){
      if(dx < 0){ goNext(); } else { goPrev(); }
    }
    touchStartX = null;
  }, { passive:true });

  /* ---------- Audio ---------- */
  var audio = document.getElementById('audio');
  var audioToggle = document.getElementById('audio-toggle');

  function setAudioIcon(){
    audioToggle.textContent = audio.paused ? '▶' : '❚❚';
    audioToggle.setAttribute('aria-label', audio.paused ? 'Reproducir canción' : 'Pausar canción');
  }
  audio.addEventListener('play', setAudioIcon);
  audio.addEventListener('pause', setAudioIcon);
  audio.addEventListener('timeupdate', slideFromSongTime);
  audio.addEventListener('loadedmetadata', function(){
    if(started) slideFromSongTime();
  });
  audioToggle.addEventListener('click', function(){
    if(audio.paused){ audio.play().catch(function(){}); }
    else{ audio.pause(); }
  });

  /* ---------- Intro ---------- */
  var introScreen = document.getElementById('intro-screen');
  var deck = document.getElementById('deck');
  var startBtn = document.getElementById('start-btn');

  startBtn.addEventListener('click', function(){
    audio.play().catch(function(){});
    introScreen.classList.add('hidden');
    deck.classList.add('show');
    audioToggle.classList.add('show');
    started = true;
    syncEnabled = true;
    renderSlide();
    slideFromSongTime();
  });

})();
</script>
</body>
</html>
